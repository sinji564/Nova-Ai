function b2blob(a){var s=atob(a.b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:a.mime})}
function toBlocks(ms){return ms.map(function(m){if(!m.att||!m.att.length)return{role:m.role,content:m.content};var c=m.att.map(function(a){return a.kind==="pdf"?{type:"document",source:{type:"base64",media_type:"application/pdf",data:a.b64}}:{type:"image",source:{type:"base64",media_type:a.mime,data:a.b64}}});c.push({type:"text",text:m.content});return{role:m.role,content:c}})}
async function packPending(v){var text=v||"",att=[],show=[];if(!v&&PEND.length)text="Please look at the attached file(s).";for(var i=0;i<PEND.length;i++){var f=PEND[i],t=f.type||"";try{if(t.indexOf("image/")===0){var d=await shrink(f);att.push({kind:"image",mime:"image/jpeg",b64:d.split(",")[1],name:f.name});show.push({name:f.name,thumb:d});text+="\n\n[Attached image: "+f.name+"]"}else if(t.indexOf("video/")===0){var fr=await frames(f);fr.forEach(function(d,k){att.push({kind:"image",mime:"image/jpeg",b64:d.split(",")[1],name:f.name+" frame "+(k+1)})});show.push({name:f.name,thumb:fr[0]});text+="\n\n[Attached video: "+f.name+"; "+fr.length+" evenly spaced frames are attached as images. Audio is not analyzed.]"}else if(t==="application/pdf"||/\.pdf$/i.test(f.name)){att.push({kind:"pdf",mime:"application/pdf",b64:await b64(f),name:f.name});show.push({name:f.name});text+="\n\n[Attached PDF: "+f.name+"]"}else if(t.indexOf("text/")===0||TXT.test(f.name)){var s=await f.text();text+="\n\n--- file: "+f.name+" ---\n"+s.slice(0,100000)+(s.length>100000?"\n[truncated]":"");show.push({name:f.name})}else{text+="\n\n[Attached binary file: "+f.name+", "+f.size+" bytes, SHA-256 "+await sha(f)+", first bytes "+await head(f)+". Contents were not opened or analyzed and the file was not run.]";show.push({name:f.name})}}catch(e){text+="\n\n[Could not read "+f.name+"]";show.push({name:f.name})}}return{text:text,att:att,show:show}}
/* engines */
var ENG=null,ENGID="",LP=null,LPID="",PB=null;
function prog(f,t){$("lf").style.width=Math.round(f*100)+"%";if(t)$("lp").textContent=String(t).slice(0,90);$("pb").style.width=(f>0&&f<1?Math.round(f*100):0)+"%";if(f>0&&f<1){var m="Loading model "+Math.round(f*100)+"%";$("mb").textContent=m;if(PB)PB.textContent=m+" (first time only)"}else $("mb").textContent=label()}
function netMsg(){return !navigator.onLine?"You’re offline. The model needs a one-time download.":hasRt()?"This page runs inside Claude, which blocks model downloads. Host your own copy (GitHub Pages) or use Auto here.":"Couldn’t download the model (Failed to fetch). Check your connection and free storage, then try again."}
async function ensureLocal(){var E=eng(),id=MODELS[E.s][MODE==="code"?1:0];if(ENG&&ENGID===id)return ENG;if(LP&&LPID===id)return LP;LPID=id;LP=(async function(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(!navigator.gpu)throw new Error("No WebGPU in this browser. Use a recent Chrome on a newer phone, or pick a Claude model.");var wl;try{wl=await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm")}catch(e){throw new Error(netMsg())}function mk(i){return wl.CreateMLCEngine(i,{initProgressCallback:function(p){prog(p.progress||0,p.text)}})}if(ENG){try{await ENG.unload()}catch(e){}ENG=null}try{ENG=await mk(id)}catch(e){var m=String(e&&e.message||e);if(/cannot find|not found/i.test(m)&&id!==MODELS[E.s][0])ENG=await mk(MODELS[E.s][0]);else throw new Error(/fetch|network/i.test(m)?netMsg():m)}ENGID=id;prog(1);return ENG})();try{return await LP}catch(e){LP=null;LPID="";prog(1);throw e}}
var LDH=false;
function showLd(first){if(LDH)return;$("lt").textContent=first?"Setting up your AI":"Starting your AI";$("ls").textContent=first?"Downloading the on-device model once. It’s saved on this phone, so next time it opens in seconds, even offline.":"Loading from this phone’s storage…";$("lr").style.display="none";$("ld").classList.add("on")}
function hideLd(){$("ld").classList.remove("on")}
function failLd(m){$("lf").style.width="0";if(LDH){flash(m);return}$("lt").textContent="Couldn’t load the AI";$("ls").textContent=m;$("lp").textContent="";$("lr").style.display="";$("ld").classList.add("on")}
function warm(){if(eng().t!=="local")return;var id=MODELS[eng().s][MODE==="code"?1:0],first=true;try{first=!localStorage.getItem("nova.dl."+id)}catch(e){}if(first||!ENG)showLd(first);ensureLocal().then(function(){try{localStorage.setItem("nova.dl."+id,"1")}catch(e){}hideLd();flash("On-device model ready")}).catch(function(e){failLd(e.message)})}
async function viaLocal(msgs,onText,box){PB=box;var g=await ensureLocal();PB=null;var last=msgs[msgs.length-1],m=[{role:"system",content:SYS()}].concat(msgs.slice(-10).map(function(x){var c=x.content;if(x===last&&x.att&&x.att.length)c+="\n\n(Note: this on-device model cannot see images, videos or PDFs.)";return{role:x.role,content:c}}));while(m[1]&&m[1].role!=="user")m.splice(1,1);var st=await g.chat.completions.create({messages:m,stream:true,temperature:TEMP[MODE]}),t="";for await(var c of st){t+=(c.choices[0]&&c.choices[0].delta&&c.choices[0].delta.content)||"";onText(t)}return t}
async function viaKey(msgs0,model){var msgs=msgs0.slice(),all="",j;for(var n=0;n<6;n++){var res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","anthropic-beta":"web-fetch-2025-09-10"},body:JSON.stringify({model:model,max_tokens:8000,tools:S.web?WEBTOOLS:undefined,system:SYS(),messages:toBlocks(msgs)})});j=await res.json();if(!res.ok)throw{code:"api",message:(j&&j.error&&j.error.message)||("HTTP "+res.status)};all+=j.content.map(function(c){return c.text||""}).join("");if(j.stop_reason!=="pause_turn")break;msgs.push({role:"assistant",content:j.content})}if(!all.trim())throw{code:"api",message:"No text returned (stop reason: "+(j&&j.stop_reason)+"). Try rephrasing or turn Web access off."};return all}
async function viaBuiltin(msgs,onText){if(!hasRt())throw{code:"none"};var s=await claude.use("sample");if(!s)throw{code:"none"};var m=msgs.map(function(x){return{role:x.role,content:x.content}});m[0]={role:"user",content:SYS()+"\n\n"+m[0].content};var o={modelTier:"complex",cache:false,onText:function(x){onText(x.text)}},la=msgs[msgs.length-1].att||[];if(la.length){try{if((await s.limits()).images)o.images=la.filter(function(a){return a.kind==="image"}).map(b2blob)}catch(e){}}var r=await s(m,o);return r.text}
/* send */
async function send(){
 var v=$("in").value.trim();if((!v&&!PEND.length)||busy)return;busy=true;
 $("in").value="";$("in").style.height="auto";
 var pk=await packPending(v);add("user",v,pk.show);
 hist.push({role:"user",content:pk.text,att:pk.att,disp:v,names:pk.show.map(function(s){return s.name})});PEND=[];drawChips();
 if(DB.chats.indexOf(CUR)<0){CUR.title=(v||(pk.show[0]&&pk.show[0].name)||"Chat").slice(0,40);DB.chats.unshift(CUR)}
 var msgs=hist.slice(-20);while(msgs.length&&msgs[0].role!=="user")msgs.shift();
 var E=eng();
 if(E.t!=="key"&&/https?:\/\//i.test(v))msgs[msgs.length-1]=Object.assign({},msgs[msgs.length-1],{content:msgs[msgs.length-1].content+"\n\n(System note: you cannot open links in this mode. Say so in one sentence and suggest pasting the page text or using a Claude model with an API key.)"});
 var box=add("assistant","");dots(box);$("go").disabled=true;
 try{
  var up=function(t){render(box,t);$("log").scrollTop=$("log").scrollHeight};
  var out=E.t==="local"?await viaLocal(msgs,up,box):E.t==="key"?await viaKey(msgs,E.m):await viaBuiltin(msgs,up);
  render(box,out);hist.push({role:"assistant",content:out});saveDB();drawer()
 }catch(e){
  hist.pop();var m="Something went wrong: "+((e&&(e.message||e.code))||e)+". Try again.";
  if(E.t==="key"&&(!e||e.code!=="api"))m="Couldn’t reach Anthropic with your key. Hosted pages inside Claude block outside requests, so key models only work on a copy you host yourself. Details: "+(e&&e.message||e);
  else if(e&&e.code==="api")m="API error: "+e.message;
  else if(e&&e.code==="none")m="No Claude is connected here. Pick an On-device model or add an API key in ⚙ Settings.";
  else if(e&&e.code==="rate_limited")m="Too many requests. Wait a moment and retry.";
  else if(e&&e.code==="not_granted")m="Permission is needed to use the AI.";
  box.textContent=m;saveDB()
 }
 busy=false;$("go").disabled=false
}
/* wiring */
$("go").onclick=send;$("att").onclick=function(){$("fi").click()};
$("fi").onchange=function(){PEND=PEND.concat(Array.from(this.files)).slice(0,6);this.value="";drawChips()};
$("in").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,140)+"px"});
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android|iPhone/i.test(navigator.userAgent)){e.preventDefault();send()}});
document.querySelectorAll(".ov").forEach(function(o){o.onclick=function(e){if(e.target===o)o.classList.remove("on")}});
document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){MODE=b.dataset.m;if(CUR)CUR.mode=MODE;syncUI();warm()}});
function nc(){if(busy)return;newChat();syncUI();$("dw").classList.remove("on")}
$("nw").onclick=nc;$("nw2").onclick=nc;
$("menu").onclick=function(){drawer();$("dw").classList.add("on")};
$("mb").onclick=function(){var l=$("ml");l.innerHTML="";OPTS.forEach(function(o){var b=el("button","op"+(S.pick===o[0]?" on":""),o[1]);b.appendChild(el("small","",o[2]));b.onclick=function(){if(o[0]==="builtin"&&!hasRt()){flash("Built-in Claude only works inside the Claude app.");return}S.pick=o[0];if(o[0].indexOf("local:")===0)S.size=o[0].slice(6);persist();$("mm").classList.remove("on");syncUI();if(o[0].indexOf("key:")===0&&!S.key){flash("Add your API key in Settings to use this.");$("gear").click()}else warm()};l.appendChild(b)});$("mm").classList.add("on")};
$("gear").onclick=function(){$("key").value=S.key;$("web").value=S.web?"on":"off";$("sys").value=S.sys;$("theme").value=S.theme;$("sh").classList.add("on")};
$("sv").onclick=function(){S.key=$("key").value.trim();S.web=$("web").value==="on";S.sys=$("sys").value;S.theme=$("theme").value;persist();applyTheme();$("sh").classList.remove("on");syncUI()};
$("clk").onclick=function(){S.key="";$("key").value="";persist();syncUI()};
$("lh").onclick=function(){LDH=true;hideLd()};$("lr").onclick=function(){LDH=false;LP=null;LPID="";warm()};
applyTheme();
if(DB.chats.length){DB.chats.sort(function(a,b){return b.t-a.t});openChat(DB.chats[0])}else{newChat();syncUI();warm()}
</script>
